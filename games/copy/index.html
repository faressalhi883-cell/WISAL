<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة النسخ (الذاكرة)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #2b1d14; color: #FFD700; font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .header { font-size: 24px; margin-bottom: 20px; text-shadow: 2px 2px 4px #000; display: flex; gap: 30px; }
        .game-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 400px; width: 90%; perspective: 1000px; }
        
        .card { position: relative; width: 100%; aspect-ratio: 1; cursor: pointer; transform-style: preserve-3d; transition: transform 0.5s; }
        .card.flipped { transform: rotateY(180deg); }
        .card.matched { transform: rotateY(180deg); pointer-events: none; opacity: 0.6; }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 3px solid #1a100a; box-shadow: 3px 3px 0 #1a100a; }
        
        .card-back { background: linear-gradient(145deg, #6b4c35, #4a3120); }
        .card-back::after { content: '?'; font-size: 30px; color: #FFD700; text-shadow: 2px 2px 4px #000; }
        
        .card-front { background: #352316; transform: rotateY(180deg); }
        
        .card.matched .card-front { box-shadow: 0 0 15px #FFD700; border-color: #FFD700; }
        
        .restart-btn { margin-top: 30px; background: #8b0000; color: #FFD700; border: 2px solid #3d0000; padding: 10px 30px; border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0 #3d0000; }
        .restart-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #3d0000; }
    </style>
</head>
<body>

    <div class="header">
        <div>الحركات: <span id="moves">0</span></div>
        <div>الأزواج: <span id="pairs">0</span></div>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <button class="restart-btn" onclick="startGame()">إعادة اللعب</button>

    <script>
        const icons = ['🐱', '🐶', '🦊', '🐻', '🐼', '🦁', '🐸', '🐵'];
        let deck = [];
        let flippedCards = [];
        let moves = 0;
        let matchedPairs = 0;
        let lockBoard = false;

        const board = document.getElementById('gameBoard');
        const movesEl = document.getElementById('moves');
        const pairsEl = document.getElementById('pairs');

        function startGame() {
            board.innerHTML = '';
            flippedCards = [];
            moves = 0;
            matchedPairs = 0;
            lockBoard = false;
            movesEl.innerText = moves;
            pairsEl.innerText = matchedPairs;

            deck = [...icons, ...icons].sort(() => Math.random() - 0.5);

            deck.forEach((icon, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.icon = icon;
                card.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">${icon}</div>
                `;
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === flippedCards[0]) return;
            if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                moves++;
                movesEl.innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const card1 = flippedCards[0];
            const card2 = flippedCards[1];
            const isMatch = card1.dataset.icon === card2.dataset.icon;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                pairsEl.innerText = matchedPairs;
                flippedCards = [];
                
                if (matchedPairs === icons.length) {
                    setTimeout(() => alert("ألف مبروك! لقد أكملت اللعبة في " + moves + " حركة."), 500);
                }
            } else {
                lockBoard = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 1000);
            }
        }

        startGame();
    </script>
</body>
</html>
