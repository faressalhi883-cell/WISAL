
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAT ROOM</title>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.6/css/unicons.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="header-container">
        <nav class="top-header">
            <div class="header-right">
                <h2 class="logo">CHAT ROOM</h2>
            </div>
            <div class="header-left">
                <a href="https://wa.me/" target="_blank" class="icon-btn whatsapp" title="واتساب"><i class="uil uil-whatsapp"></i></a>
                <button class="icon-btn"><i class="uil uil-search"></i></button>
                <button class="icon-btn"><i class="uil uil-plus-circle"></i></button>
            </div>
        </nav>

        <div class="mobile-tabs">
            <button class="tab-btn active" onclick="switchTab('home')"><i class="uil uil-estate"></i></button>
            <button class="tab-btn" onclick="switchTab('reels')"><i class="uil uil-play-circle"></i></button>
            <button class="tab-btn" onclick="switchTab('chats')"><i class="uil uil-comment-alt-message"></i></button>
            <button class="tab-btn" onclick="switchTab('groups')"><i class="uil uil-users-alt"></i></button>
            <button class="tab-btn" id="theme-toggle"><i class="uil uil-moon"></i></button>
            <button class="tab-btn"><i class="uil uil-bell"></i></button>
            <div class="tab-btn profile-tab"><img src="https://www.w3schools.com/howto/img_avatar.png" alt="Profile"></div>
        </div>
    </div>

    <main class="main-content">
        
        <section id="home-tab" class="section active">
            <div class="create-post">
                <img src="https://www.w3schools.com/howto/img_avatar.png" alt="Profile" class="profile-pic">
                <input type="text" placeholder="بم تفكر؟" id="create-post-input">
                <input type="file" id="image-input" accept="image/*" style="display: none;">
                <label for="image-input" class="btn-primary" style="cursor: pointer; padding: 8px; border-radius: 50%; margin-right: 5px; display: flex; align-items: center; justify-content: center;"><i class="uil uil-image"></i></label>
                <button id="post-btn" class="btn-primary">نشر</button>
            </div>

            <div class="stories-container">
                <div class="story-card create-story"><img src="https://www.w3schools.com/howto/img_avatar.png" alt="My Profile"><div class="plus-icon"><i class="uil uil-plus"></i></div><p>إنشاء قصة</p></div>
                <div class="story-card"><img src="https://picsum.photos/200/300?random=1" alt="Story"><p>ليلى</p></div>
                <div class="story-card"><img src="https://picsum.photos/200/300?random=2" alt="Story"><p>أحمد</p></div>
            </div>

            <div class="feeds" id="feeds-container"></div>
        </section>

        <section id="reels-tab" class="section">
            <h3 class="section-title">الريلز والفيديوهات</h3>
            <div class="reels-grid">
                <div class="reel"><img src="https://picsum.photos/400/600?random=3"><i class="uil uil-play-circle"></i></div>
                <div class="reel"><img src="https://picsum.photos/400/600?random=4"><i class="uil uil-play-circle"></i></div>
            </div>
        </section>

        <section id="chats-tab" class="section">
            <div id="chat-list-view">
                <h3 class="section-title">المحادثات</h3>
                <div id="users-container"></div>
            </div>

            <div id="chat-room-view" style="display:none; flex-direction:column; height:70vh; background: var(--card-bg); border-radius: 10px; padding: 10px;">
                <div style="display:flex; align-items:center; gap:10px; padding:10px; border-bottom:1px solid var(--border-color);">
                    <button onclick="closeChatRoom()" class="icon-btn"><i class="uil uil-arrow-left"></i></button>
                    <h4 id="chat-with-name">محادثة</h4>
                </div>
                <div id="messages-container" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:10px;"></div>
                <div style="display:flex; gap:8px; padding:10px; border-top:1px solid var(--border-color);">
                    <input type="text" id="message-input" placeholder="اكتب رسالة..." style="flex:1; padding:10px; border-radius:20px; border:1px solid var(--border-color); background: var(--bg-color); color: var(--text-color);">
                    <button id="send-message-btn" class="btn-primary">إرسال</button>
                </div>
            </div>
        </section>

        <section id="groups-tab" class="section">
            <h3 class="section-title">المجموعات</h3>
            <p style="text-align: center; color: gray; margin-top: 20px;">لا توجد مجموعات حالياً</p>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
