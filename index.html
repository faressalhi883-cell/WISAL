<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHAT ROOM | Royal 3D</title>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.6/css/unicons.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#160d09">
</head>
<body oncontextmenu="return false;">

    <!-- الشريط العلوي -->
    <header class="app-header">
        <div class="topline">
            <div class="logo">US</div>
            <div class="brand">
                <h1>CHAT ROOM</h1>
                <p>تواصل • تعرّف • أصدقاء جدد</p>
            </div>
            <button class="iconbtn" onclick="alert('الإشعارات قريباً')"><i class="uil uil-bell"></i><span class="badge">3</span></button>
            <button class="iconbtn" onclick="alert('البحث قريباً')"><i class="uil uil-search"></i></button>
        </div>

        <!-- القائمة السريعة -->
        <div class="quick">
            <button type="button" class="purple-card" onclick="document.getElementById('profile-pic-input').click()">
                <i class="uil uil-user"></i>
                <span>حسابي <i class="uil uil-angle-left"></i></span>
                <input type="file" id="profile-pic-input" accept="image/*" style="display: none;">
            </button>
            <button type="button"><i class="uil uil-search"></i><span>بحث</span></button>
            <a href="https://wa.me/" target="_blank"><i class="uil uil-whatsapp"></i><span>واتساب</span></a>
            <button type="button" onclick="triggerLightning()"><i class="uil uil-eye"></i><span>رؤية</span></button>
        </div>
    </header>

    <!-- قسم الرئيسية (المنشورات) -->
    <main class="main-content" id="home-section">
        <!-- إنشاء منشور -->
        <div class="composer">
            <div class="compose-row">
                <div class="avatar" id="post-avatar">US</div>
                <input type="text" placeholder="ماذا تفكر؟" id="create-post-input">
            </div>
            <div class="actions">
                <input type="file" id="image-input" accept="image/*" hidden>
                <button type="button" class="btn" onclick="document.getElementById('image-input').click()"><i class="uil uil-image"></i> صورة</button>
                <button type="button" class="btn primary" id="post-btn">نشر <i class="uil uil-telegram-alt"></i></button>
            </div>
            <div id="image-preview-container" hidden>
                <img id="image-preview" src="" alt="Preview">
            </div>
        </div>

        <!-- القصص -->
        <div class="stories-container">
            <div class="story create-story">
                <div class="story-img"><i class="uil uil-plus"></i></div>
                <span>إضافة قصة</span>
            </div>
            <div class="story"><div class="story-img"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop"></div><span>ليلى</span></div>
            <div class="story"><div class="story-img"><img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100&h=100&fit=crop"></div><span>أحمد</span></div>
        </div>

        <!-- المنشورات -->
        <div class="feeds" id="feeds-container"></div>
    </main>

    <!-- قسم المحادثات (مخفي افتراضياً) -->
    <main class="main-content" id="chats-section" style="display: none;">
        <div id="chat-list-view">
            <h3 class="section-title">المحادثات</h3>
            <div id="users-container"></div>
        </div>
        <div id="chat-room-view" style="display: none;">
            <div class="chat-header">
                <button onclick="closeChatRoom()" class="iconbtn"><i class="uil uil-arrow-right"></i></button>
                <h4 id="chat-with-name">محادثة</h4>
            </div>
            <div id="messages-container"></div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="اكتب رسالة...">
                <button id="send-message-btn" class="btn primary">إرسال</button>
            </div>
        </div>
    </main>

    <!-- قسم الألعاب (مخفي افتراضياً) -->
    <main class="main-content" id="games-section" style="display: none;">
        <h3 class="section-title">مركز الألعاب</h3>
        <div class="games-grid">
            <!-- دادوسا -->
            <div class="game-card" onclick="openGame('./games/dadousa/index.html', 'دادوسا')">
                <i class="uil uil-dice-four"></i>
                <h4>دادوسا</h4>
            </div>
            <!-- لعبة النسخ -->
            <div class="game-card" onclick="openGame('./games/copy/index.html', 'لعبة النسخ')">
                <i class="uil uil-copy"></i>
                <h4>النسخ</h4>
            </div>
            <!-- الدبابات -->
            <div class="game-card" onclick="openGame('./games/tank/index.html', 'الدبابات')">
                <i class="uil uil-dizzy-meh"></i>
                <h4>الدبابات</h4>
            </div>
            <!-- القناص -->
            <div class="game-card" onclick="openGame('./games/sniper/index.html', 'القناص')">
                <i class="uil uil-crosshairs"></i>
                <h4>القناص</h4>
            </div>
        </div>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <button type="button" class="active" onclick="switchTab('home')">
            <i class="uil uil-estate"></i>
            <span>الرئيسية</span>
        </button>
        <button type="button" onclick="alert('الأصدقاء قريباً')">
            <i class="uil uil-users-alt"></i>
            <span>الأصدقاء</span>
        </button>
        
        <!-- الزر العائم للألعاب -->
        <div class="fab-container">
            <button type="button" class="fab-btn" onclick="switchTab('games')">
                <i class="uil uil-plus"></i>
            </button>
        </div>

        <button type="button" onclick="switchTab('chats')">
            <i class="uil uil-comment-alt-message"></i>
            <span>الدردشة</span>
        </button>
        <button type="button" onclick="alert('الملف الشخصي قريباً')">
            <i class="uil uil-user"></i>
            <span>ملفي</span>
        </button>
    </nav>

    <!-- شاشة البرق -->
    <div id="lightning-overlay"></div>

    <!-- شاشة عرض الألعاب -->
    <div id="game-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#160d09; z-index:999999; flex-direction:column;">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px; background:#28170f; border-bottom:2px solid #ffd65a;">
            <h3 id="game-title" style="color:#ffd65a; margin:0;">اللعبة</h3>
            <button onclick="closeGame()" style="background:#352015; color:#ffd65a; border:1px solid #ffd65a; padding:5px 15px; border-radius:5px; font-family:inherit;">إغلاق</button>
        </div>
        <iframe id="game-frame" src="" style="flex:1; width:100%; border:none;"></iframe>
    </div>

    <script type="module" src="script.js"></script>
    <script>
        // دالة سحرية للتبديل بين الشاشات الثلاث (الرئيسية، المحادثات، الألعاب)
        window.switchTab = function(tab) {
            document.getElementById('home-section').style.display = 'none';
            document.getElementById('chats-section').style.display = 'none';
            document.getElementById('games-section').style.display = 'none';

            // إزالة التفعيل من كل الأزرار
            document.querySelectorAll('.bottom-nav button').forEach(btn => btn.classList.remove('active'));

            if (tab === 'home') {
                document.getElementById('home-section').style.display = 'block';
                document.querySelectorAll('.bottom-nav button')[0].classList.add('active');
            } else if (tab === 'chats') {
                document.getElementById('chats-section').style.display = 'block';
                document.querySelectorAll('.bottom-nav button')[3].classList.add('active');
                if(typeof loadUsersList === 'function') loadUsersList();
            } else if (tab === 'games') {
                document.getElementById('games-section').style.display = 'block';
            }
        };
        
        // ربط PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</body>
</html>
