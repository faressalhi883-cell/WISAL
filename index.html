<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHAT ROOM | Royal 3D</title>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.6/css/unicons.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#160d09">
</head>
<body oncontextmenu="return false;">
<div class="app">
    <!-- الشريط العلوي -->
    <header>
        <div class="topline">
            <div class="logo">US</div>
            <div class="brand">
                <h1>CHAT ROOM</h1>
                <p>تواصل • تعرّف • أصدقاء جدد</p>
            </div>
            <button class="iconbtn" data-toast="الإشعارات قريباً"><i class="uil uil-bell"></i></button>
            <button class="iconbtn" data-toast="البحث قريباً"><i class="uil uil-search"></i></button>
            <button class="iconbtn" data-toast="القائمة"><i class="uil uil-bars"></i></button>
        </div>

        <!-- القائمة السريعة -->
        <div class="quick">
            <button type="button" onclick="document.getElementById('profile-pic-input').click()">
                <i class="uil uil-user sym"></i>حسابي
                <input type="file" id="profile-pic-input" accept="image/*" style="display: none;">
            </button>
            <button type="button" data-toast="البحث قريباً"><i class="uil uil-search sym"></i>بحث</button>
            <a href="https://wa.me/" target="_blank" style="text-decoration:none;">
                <button type="button"><i class="uil uil-whatsapp sym"></i>واتساب</button>
            </a>
            <button type="button" onclick="triggerLightning()"><i class="uil uil-eye sym"></i>رؤية</button>
        </div>
    </header>

    <!-- شريط التبويبات -->
    <div class="tabs" role="tablist">
        <button type="button" class="active" data-tab="home"><i class="uil uil-estate"></i></button>
        <button type="button" data-tab="chats" onclick="switchTab('chats')"><i class="uil uil-comment-alt-message"></i></button>
        <button type="button" data-tab="friends"><i class="uil uil-users-alt"></i></button>
        <button type="button" data-tab="videos"><i class="uil uil-play-circle"></i></button>
    </div>

    <!-- المحتوى الرئيسي (المنشورات) -->
    <main id="home-section">
        <!-- إنشاء منشور -->
        <section class="composer">
            <div class="compose-row">
                <div class="avatar" id="post-avatar">US</div>
                <input type="text" id="create-post-input" placeholder="بم تفكر؟" maxlength="500">
            </div>
            <div class="actions">
                <input type="file" id="image-input" accept="image/*" hidden>
                <button type="button" class="btn" onclick="document.getElementById('image-input').click()"><i class="uil uil-image"></i> صورة</button>
                <button type="button" class="btn primary" id="post-btn">نشر ✦</button>
            </div>
            <div id="image-preview-container" hidden style="margin-top:10px;">
                <img id="image-preview" src="" style="width:100%; border-radius:12px;" alt="Preview">
            </div>
        </section>

        <!-- القصص -->
        <section>
            <div class="section-title"><span>القصص</span><small>شارك لحظاتك ✨</small></div>
            <div class="stories">
                <div class="story add" id="addStoryBtn"><span class="plus">＋</span><strong>إضافة قصة</strong></div>
                <div class="story"><div class="savatar">س</div><strong>سارة</strong></div>
                <div class="story"><div class="savatar">أ</div><strong>أحمد</strong></div>
            </div>
        </section>

        <!-- المنشورات (سيتم توليدها من script.js) -->
        <div class="section-title"><span>آخر المنشورات</span></div>
        <div id="feeds-container" style="display:flex; flex-direction:column; gap:18px;"></div>
    </main>

    <!-- قسم المحادثات (مخفي افتراضياً) -->
    <main id="chats-section" style="display: none;">
        <div id="chat-list-view">
            <h3 class="section-title">المحادثات</h3>
            <div id="users-container"></div>
        </div>
        <div id="chat-room-view" style="display: none;">
            <div class="chat-header" style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
                <button onclick="closeChatRoom()" class="iconbtn"><i class="uil uil-arrow-right"></i></button>
                <h4 id="chat-with-name" style="color:var(--gold); margin:0;">محادثة</h4>
            </div>
            <div id="messages-container" style="height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:10px;"></div>
            <div class="chat-input-area" style="display:flex; gap:8px; margin-top:15px;">
                <input type="text" id="message-input" placeholder="اكتب رسالة..." style="flex:1; padding:12px; border-radius:12px; border:1px solid #54351f; background:#170d09; color:white; outline:none;">
                <button id="send-message-btn" class="btn primary">إرسال</button>
            </div>
        </div>
    </main>

    <!-- الشريط السفلي -->
    <nav class="nav">
        <button type="button" class="active" onclick="switchTab('home')"><span><i class="uil uil-estate"></i></span>الرئيسية</button>
        <button type="button" onclick="switchTab('friends')"><span><i class="uil uil-users-alt"></i></span>الأصدقاء</button>
        
        <!-- زر + العائم (يفتح قائمة الألعاب) -->
        <button type="button" class="create" id="plusBtn" aria-label="قائمة الألعاب"><i class="uil uil-plus"></i></button>
        
        <button type="button" onclick="switchTab('chats')"><span><i class="uil uil-comment-alt-message"></i></span>الدردشة</button>
        <button type="button" data-toast="ملفي الشخصي"><span><i class="uil uil-user"></i></span>ملفي</button>
    </nav>

    <!-- القائمة المنبثقة (Plus Menu) للألعاب -->
    <div class="plus-menu" id="plusMenu" hidden>
        <div class="plus-menu-card">
            <div class="plus-menu-head">
                <strong>مركز الألعاب</strong>
                <button class="iconbtn" id="closePlus" style="width:30px; height:30px; font-size:14px;"><i class="uil uil-times"></i></button>
            </div>
            <div class="plus-grid">
                <!-- لعبة دادوسا -->
                <button class="game-tile" onclick="openGame('./games/dadousa/index.html', 'دادوسا')">
                    <i class="uil uil-dice-four"></i>
                    <span>دادوسا</span>
                </button>
                <!-- لعبة النسخ -->
                <button onclick="openGame('./games/copy/index.html', 'النسخ')">
                    <i class="uil uil-copy"></i>
                    <span>النسخ</span>
                </button>
                <!-- لعبة الدبابات -->
                <button onclick="openGame('./games/tank/index.html', 'الدبابات')">
                    <i class="uil uil-dizzy-meh"></i>
                    <span>الدبابات</span>
                </button>
            </div>
        </div>
    </div>

    <!-- شاشة اللعبة (Modal) -->
    <div class="game-modal" id="gameModal" hidden>
        <div class="game-card" style="width: 100vw; height: 100vh; border-radius: 0; display: flex; flex-direction: column;">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #69462b;">
                <h3 id="gameTitle" style="color:var(--gold); margin:0;">اللعبة</h3>
                <button class="btn" id="closeGameBtn" onclick="closeGame()">إغلاق X</button>
            </div>
            <iframe id="gameFrame" src="" style="flex:1; border:none; width:100%;"></iframe>
        </div>
    </div>

    <!-- شاشة البرق (Royal) -->
    <div id="lightning-overlay"></div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>
</div>

<script type="module" src="script.js"></script>
<script>
    // --- إدارة القائمة المنبثقة (Plus Menu) ---
    const plusBtn = document.getElementById('plusBtn');
    const plusMenu = document.getElementById('plusMenu');
    const closePlus = document.getElementById('closePlus');

    plusBtn.addEventListener('click', () => {
        plusMenu.hidden = !plusMenu.hidden;
    });
    closePlus.addEventListener('click', () => {
        plusMenu.hidden = true;
    });

    // --- تبديل الشاشات (الرئيسية والمحادثات) ---
    window.switchTab = function(tab) {
        document.getElementById('home-section').style.display = 'none';
        document.getElementById('chats-section').style.display = 'none';
        
        // إزالة التفعيل من كل الأزرار
        document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
        
        if (tab === 'home') {
            document.getElementById('home-section').style.display = 'grid';
            document.querySelectorAll('.nav button')[0].classList.add('active');
        } else if (tab === 'chats') {
            document.getElementById('chats-section').style.display = 'block';
            document.querySelectorAll('.nav button')[3].classList.add('active');
            if(typeof loadUsersList === 'function') loadUsersList();
        }
    };

    // --- إدارة فتح وإغلاق الألعاب ---
    window.openGame = function(url, title) {
        document.getElementById('gameTitle').innerText = title;
        document.getElementById('gameFrame').src = url;
        document.getElementById('gameModal').hidden = false;
        plusMenu.hidden = true; // إغلاق القائمة المنبثقة
    };

    window.closeGame = function() {
        document.getElementById('gameFrame').src = "";
        document.getElementById('gameModal').hidden = true;
    };

    // --- شاشة البرق ---
    window.triggerLightning = function() {
        const overlay = document.getElementById('lightning-overlay');
        overlay.classList.remove('strike');
        void overlay.offsetWidth;
        overlay.classList.add('strike');
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    };

    // --- Toast (رسائل التنبيه) ---
    document.querySelectorAll('[data-toast]').forEach(el => {
        el.addEventListener('click', () => {
            const toast = document.getElementById('toast');
            toast.innerText = el.getAttribute('data-toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        });
    });

    // --- PWA ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
</script>
</body>
</html>
