<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAT ROOM</title>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.6/css/unicons.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav class="top-header">
        <div class="header-right">
            <h2 class="logo">CHAT ROOM</h2>
        </div>
        <div class="header-left">
            <a href="#" class="icon-btn"><i class="uil uil-plus-circle"></i></a>
            <button class="icon-btn"><i class="uil uil-search"></i></button>
            <a href="https://wa.me/" target="_blank" class="icon-btn whatsapp"><i class="uil uil-whatsapp"></i></a>
        </div>
    </nav>
    <div class="mobile-tabs">
        <button class="tab-btn active" onclick="switchTab('home')"><i class="uil uil-estate"></i></button>
        <button class="tab-btn" onclick="switchTab('reels')"><i class="uil uil-play-circle"></i></button>
        <button class="tab-btn" onclick="switchTab('chats')"><i class="uil uil-comment-alt-message"></i></button>
        <button class="tab-btn" onclick="switchTab('groups')"><i class="uil uil-users-alt"></i></button>
        <button class="tab-btn" id="theme-toggle"><i class="uil uil-moon"></i></button>
        <button class="tab-btn"><i class="uil uil-bell"></i></button>
        <div class="tab-btn profile-tab"><img src="./profile.jpg" alt="Profile"></div>
    </div>
    <main class="main-content">
        <section id="home-tab" class="section active">
            <div class="create-post">
                <img src="./profile.jpg" alt="Profile" class="profile-pic">
                <input type="text" placeholder="بم تفكر؟" id="create-post-input">
                <button id="post-btn" class="btn-primary"><i class="uil uil-image"></i></button>
            </div>    <div class="stories-container">
        <div class="story-card create-story">
            <img src="./profile.jpg" alt="My Profile">
            <div class="plus-icon"><i class="uil uil-plus"></i></div>
            <p>إنشاء قصة</p>
        </div>
        <div class="story-card"><img src="./story-1.jpg" alt="Story"><p>ليلى</p></div>
        <div class="story-card"><img src="./story-2.jpg" alt="Story"><p>أحمد</p></div>
        <div class="story-card"><img src="./story-3.jpg" alt="Story"><p>سارة</p></div>
    </div>
    <div class="feeds" id="feeds-container">
        <div class="feed">
            <div class="feed-header">
                <img src="./profile-2.jpg" alt="User" class="profile-pic">
                <div class="feed-info">
                    <h4>Meh Mehmed</h4>
                    <span>منذ ساعتين · <i class="uil uil-globe"></i></span>
                </div>
                <i class="uil uil-ellipsis-h more-icon"></i>
            </div>
            <div class="feed-content">
                <p>سلام عليكم، متوفر لدينا طوب بناء بجودة ممتازة وأسعار منافسة. للتواصل والاستفسار يرجى مراسلتنا. 🧱</p>
                <img src="./feed-1.jpg" alt="Post Image" class="feed-image">
            </div>
            <div class="feed-actions">
                <button><i class="uil uil-thumbs-up"></i> أعجبني</button>
                <button><i class="uil uil-comment-alt-message"></i> تعليق</button>
                <button><i class="uil uil-share-alt"></i> مشاركة</button>
            </div>
        </div>
    </div>
        </section>        <section id="reels-tab" class="section">
            <h3 class="section-title">الريلز</h3>
            <div class="reels-grid">
                <div class="reel"><img src="./feed-3.jpg"><i class="uil uil-play-circle"></i></div>
                <div class="reel"><img src="./feed-2.jpg"><i class="uil uil-play-circle"></i></div>
            </div>
        </section>
        <section id="chats-tab" class="section">
            <h3 class="section-title">المحادثات</h3>
            <div class="chat-item">
                <img src="./profile-3.jpg" class="profile-pic">
                <div class="chat-info">
                    <h4>مجموعة المبرمجين</h4>
                    <p>مرحباً بالجميع في CHAT ROOM</p>
                </div>
            </div>
        </section>
        <section id="groups-tab" class="section">
            <h3 class="section-title">المجموعات</h3>
            <p style="text-align: center; color: gray; margin-top: 20px;">لا توجد مجموعات حالياً</p>
        </section>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
