<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHAT ROOM | Royal 3D</title>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.6/css/unicons.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#160d09">
</head>
<body oncontextmenu="return false;">

    <!-- الشريط العلوي -->
    <header>
        <div class="topline">
            <div class="header-icons">
                <button class="iconbtn" data-toast="القائمة"><i class="uil uil-bars"></i></button>
                <button class="iconbtn" data-toast="البحث"><i class="uil uil-search"></i></button>
                <button class="iconbtn" data-toast="الإشعارات"><i class="uil uil-bell"></i></button>
            </div>
            <div class="header-brand">
                <h1>CHAT ROOM</h1>
                <p>تواصل • تعرّف • أصدقاء جدد</p>
            </div>
            <div class="logo">US</div>
        </div>

        <div class="quick">
            <button type="button" onclick="document.getElementById('profile-pic-input').click()">
                <i class="uil uil-user sym"></i><span>حسابي</span>
                <input type="file" id="profile-pic-input" accept="image/*" style="display: none;">
            </button>
            <button type="button" data-toast="البحث قريباً"><i class="uil uil-search sym"></i><span>بحث</span></button>
            <a href="https://wa.me/" target="_blank"><i class="uil uil-whatsapp sym"></i><span>واتساب</span></a>
            <button type="button" onclick="triggerLightning()"><i class="uil uil-eye sym"></i><span>رؤية</span></button>
        </div>
    </header>

    <!-- شريط التبويبات العلوي -->
    <div class="tabs">
        <button class="active" onclick="switchTab('home')"><i class="uil uil-estate"></i></button>
        <button onclick="switchTab('chats')"><i class="uil uil-comment-alt-message"></i></button>
        <button onclick="switchTab('friends')"><i class="uil uil-users-alt"></i></button>
        <button data-toast="الفيديوهات قريباً"><i class="uil uil-play-circle"></i></button>
    </div>

    <!-- 1. قسم الرئيسية (المنشورات) -->
    <main id="home-section" style="display: block;">
        <div class="composer">
            <div class="compose-top">
                <div class="avatar" id="post-avatar">US</div>
                <input type="text" id="create-post-input" placeholder="بم تفكر؟" maxlength="500">
            </div>
            <div class="actions">
                <input type="file" id="image-input" accept="image/*" hidden>
                <button type="button" class="btn" onclick="document.getElementById('image-input').click()"><i class="uil uil-image"></i> صورة</button>
                <button type="button" class="btn primary" id="post-btn">نشر ✦</button>
            </div>
            <div id="image-preview-container" hidden style="margin-top:10px;">
                <img id="image-preview" src="" style="width:100%; border-radius:12px;" alt="Preview">
            </div>
        </div>

        <div class="section-title"><span>القصص</span><small>شارك لحظاتك ✨</small></div>
        <div class="stories">
            <div class="story create-story"><div class="story-img"><i class="uil uil-plus"></i></div><span>إضافة</span></div>
            <div class="story"><div class="savatar">س</div><span>سارة</span></div>
            <div class="story"><div class="savatar">أ</div><span>أحمد</span></div>
            <div class="story"><div class="savatar">ل</div><span>ليلى</span></div>
        </div>

        <div class="section-title"><span>آخر المنشورات</span></div>
        <div id="feeds-container" class="feeds-list"></div>
    </main>

    <!-- 2. قسم المحادثات -->
    <main id="chats-section" style="display: none;">
        <div id="chat-list-view">
            <h3 class="section-title">المحادثات</h3>
            <div id="users-container"></div>
        </div>
        <div id="chat-room-view">
            <div class="chat-header">
                <button onclick="closeChatRoom()" class="iconbtn"><i class="uil uil-arrow-right"></i></button>
                <h4 id="chat-with-name">محادثة</h4>
            </div>
            <div id="messages-container"></div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="اكتب رسالة...">
                <button id="send-message-btn" class="btn primary">إرسال</button>
            </div>
        </div>
    </main>

    <!-- 3. قسم الأصدقاء -->
    <main id="friends-section" style="display: none;">
        <h3 class="section-title">الأصدقاء</h3>
        <div id="friends-container" class="feeds-list"></div>
    </main>

    <!-- 4. قسم الملف الشخصي -->
    <main id="profile-section" style="display: none;">
        <div class="profile-card">
            <img src="https://ui-avatars.com/api/?name=User&background=8b20e8&color=fff" id="profile-page-avatar" class="profile-page-avatar">
            <h2 id="profile-page-name">اسم المستخدم</h2>
            <p id="profile-page-email" style="color: var(--muted); font-size: 13px;">البريد الإلكتروني</p>
            <div class="profile-stats">
                <div><strong id="profile-post-count">0</strong><br><span>منشور</span></div>
                <div><strong>0</strong><br><span>صديق</span></div>
            </div>
        </div>
        <h3 class="section-title" style="margin-top: 20px;">منشوراتي</h3>
        <div id="my-posts-container" class="feeds-list"></div>
    </main>

    <!-- الشريط السفلي -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home')"><i class="uil uil-estate"></i><span>الرئيسية</span></button>
        <button class="nav-item" onclick="switchTab('friends')"><i class="uil uil-users-alt"></i><span>الأصدقاء</span></button>
        <button class="nav-item fab-btn" id="plusBtn"><i class="uil uil-plus"></i></button>
        <button class="nav-item" onclick="switchTab('chats')"><i class="uil uil-comment-alt-message"></i><span>الدردشة</span></button>
        <button class="nav-item" onclick="switchTab('profile')"><i class="uil uil-user"></i><span>ملفي</span></button>
    </nav>

    <!-- قائمة الألعاب -->
    <div class="plus-menu" id="plusMenu" hidden>
        <div class="plus-menu-card">
            <div class="plus-menu-head">
                <strong>مركز الألعاب</strong>
                <button class="iconbtn" id="closePlus" style="width:30px;height:30px;"><i class="uil uil-times"></i></button>
            </div>
            <div class="plus-grid">
                <!-- هنا تم تصحيح مسار دادوسا ليفتح الملف الجديد -->
                <button class="game-tile" onclick="openGame('./dadousa.html', 'دادوسا')"><i class="uil uil-dice-four"></i><span>دادوسا</span></button>
                <button onclick="openGame('./games/copy/index.html', 'النسخ')"><i class="uil uil-copy"></i><span>النسخ</span></button>
                <button onclick="openGame('./games/tank/index.html', 'الدبابات')"><i class="uil uil-dizzy-meh"></i><span>الدبابات</span></button>
            </div>
        </div>
    </div>

    <!-- شاشة اللعبة -->
    <div class="game-modal" id="gameModal" hidden>
        <div class="game-header">
            <h3 id="gameTitle">اللعبة</h3>
            <button onclick="closeGame()">إغلاق X</button>
        </div>
        <iframe id="gameFrame" src=""></iframe>
    </div>

    <div id="lightning-overlay"></div>
    <div class="toast" id="toast"></div>

    <script type="module" src="script.js"></script>
    <script>
        // سكريبت الواجهة (التنقل، الألعاب، البرق، القوائم)
        const plusBtn = document.getElementById('plusBtn');
        const plusMenu = document.getElementById('plusMenu');
        const closePlus = document.getElementById('closePlus');
        
        plusBtn.addEventListener('click', () => { plusMenu.hidden = !plusMenu.hidden; });
        closePlus.addEventListener('click', () => { plusMenu.hidden = true; });

        window.switchTab = function(tab) {
            document.querySelectorAll('main').forEach(m => m.style.display = 'none');
            document.querySelectorAll('.bottom-nav .nav-item').forEach(btn => btn.classList.remove('active'));
            
            if (tab === 'home') {
                document.getElementById('home-section').style.display = 'block';
                document.querySelectorAll('.bottom-nav .nav-item')[0].classList.add('active');
            } else if (tab === 'chats') {
                document.getElementById('chats-section').style.display = 'block';
                document.querySelectorAll('.bottom-nav .nav-item')[3].classList.add('active');
                if(typeof loadUsersList === 'function') loadUsersList();
            } else if (tab === 'friends') {
                document.getElementById('friends-section').style.display = 'block';
                document.querySelectorAll('.bottom-nav .nav-item')[1].classList.add('active');
                if(typeof loadFriendsList === 'function') loadFriendsList();
            } else if (tab === 'profile') {
                document.getElementById('profile-section').style.display = 'block';
                document.querySelectorAll('.bottom-nav .nav-item')[4].classList.add('active');
                if(typeof loadProfile === 'function') loadProfile();
            }
        };

        window.openGame = function(url, title) {
            document.getElementById('gameTitle').innerText = title;
            document.getElementById('gameFrame').src = url;
            document.getElementById('gameModal').hidden = false;
            plusMenu.hidden = true;
        };
        window.closeGame = function() {
            document.getElementById('gameFrame').src = "";
            document.getElementById('gameModal').hidden = true;
        };
        window.triggerLightning = function() {
            const overlay = document.getElementById('lightning-overlay');
            overlay.classList.remove('strike');
            void overlay.offsetWidth;
            overlay.classList.add('strike');
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        };
        document.querySelectorAll('[data-toast]').forEach(el => {
            el.addEventListener('click', () => {
                const t = document.getElementById('toast');
                t.innerText = el.getAttribute('data-toast');
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2000);
            });
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</body>
</html>
